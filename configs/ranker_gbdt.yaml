# M7 GBDT ranker (sklearn HistGradientBoostingClassifier -- see
# src/train/ranker_trainer.py docstring for why not LightGBM). Also used,
# with feature_group swapped, for the M7 feature-group ablation
# (recall_only -> stats -> spatial -> full).
model:
  type: gbdt
  max_iter: 200
  max_depth: 6
  learning_rate: 0.1
  l2_regularization: 0.0
feature_group: full
seed: 2020
